# Gateway de modelos del bot de Shirley (IP-001 / ADR-002).
#
# Claude Agent SDK habla Anthropic Messages API → LiteLLM traduce a
# OpenAI-compatible → Groq free tier. Política #253 ($0/mes) intacta:
# la app NUNCA llama a Anthropic paga, todo pasa por acá.
model_list:
  - model_name: nenufar-bot
    litellm_params:
      model: groq/llama-3.3-70b-versatile # los ids de Groq rotan: verificar en console.groq.com
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  # CRÍTICO: el SDK envía params Anthropic (thinking, cache_control…) que Groq
  # no soporta; LiteLLM los descarta en vez de fallar. Si la inferencia se
  # comporta raro, revisar esto PRIMERO.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
